# ============================================
# UDIPSAI Backend Unificado - Configuración
# ============================================
spring.application.name=udipsai-backend
spring.application.security.fe_url=${FE_URL}

# Puerto del servidor
server.port=8080

# ============================================
# Configuración de MySQL (Base de datos única)
# ============================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/pruebasvin?useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

# Configuración de JPA/Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar ejecución de data.sql después de crear tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Pool de conexiones - Configuración optimizada
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ============================================
# Configuración de Seguridad y Logging
# ============================================
logging.level.org.springframework.security.web.*=debug
logging.level.com.udipsai.backend=debug

# ============================================
# Custom handler para errores 404
# ============================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.path=/error

# ============================================
# Configuración de Actuator
# ============================================
info.application.name=Sistema de Turnos UDIPSAI - Backend Unificado
info.application.description=Backend unificado que integra autenticación, usuarios y citas para el sistema de agendamiento de turnos de UDIPSAI
info.application.version=1.0.0
info.application.database=MySQL
info.application.spring-boot-version=@project.parent.version@

management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
management.metrics.enable.all=false
management.metrics.enable.jvm.memory.used=true
management.metrics.enable.system.cpu.usage=true
management.metrics.enable.http.server.requests=true
management.metrics.enable.process.uptime=true

# ============================================
# Configuración de JWT
# ============================================
jwt.secret=${JWT_SECRET:Jeremy_25312}
jwt.expiration.days=${JWT_EXPIRATION_DAYS:15}
jwt.issuer=${JWT_ISSUER:UCACUE_UDIPSAI}

# ============================================
# Configuración de CORS
# ============================================
# El frontend puede hacer peticiones desde cualquier origen configurado
# Esta configuración se maneja en la clase CorsConfig
server.error.include-message=always
server.error.include-stacktrace=always
