<div class="min-h-screen flex w-full font-sans">
    <!-- Left Side: Brand/Visual (Hidden on mobile) -->
    <div
        class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-ucacue-crimson to-ucacue-watermelon items-center justify-center relative overflow-hidden">
        <!-- Decorative shapes -->
        <div class="absolute bg-white opacity-10 rounded-full w-96 h-96 -top-20 -left-20 animate-pulse"></div>
        <div class="absolute bg-white opacity-10 rounded-full w-72 h-72 bottom-20 right-20"></div>

        <div class="z-10 text-center text-white p-8">
            <div class="bg-white/20 backdrop-blur-sm p-6 rounded-full inline-block mb-6 shadow-xl">
                <!-- Using logo_UCACUE.png. If it is high res, styling it to fit. Filter brightness to make sure it stands out if needed, but original colors are likely fine on white bg, here we have red bg. -->
                <!-- Assuming logo has transparency. If not, the white circle helps. -->
                <img src="assets/logo_UCACUE.png" alt="UCACUE" class="h-32 mx-auto drop-shadow-md">
            </div>
            <h1 class="text-5xl font-extrabold mb-3 tracking-tight">UDIPSAI</h1>
            <p class="text-xl font-medium opacity-95 max-w-md mx-auto">Unidad de Diagnóstico e Investigación
                Psicopedagógica</p>
            <div class="mt-8 h-1 w-24 bg-white/50 mx-auto rounded-full"></div>
        </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center bg-gray-50 p-6 sm:p-12">
        <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-2xl shadow-xl border border-gray-100">
            <div class="text-center mb-10">
                <!-- Mobile only logo -->
                <img src="assets/logo_UDIPS.png" alt="UDIPS" class="h-24 mx-auto mb-6 lg:hidden">
                <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Bienvenido</h2>
                <p class="text-gray-500 mt-2 text-sm">Ingresa tus credenciales institucionales para acceder</p>
            </div>

            <form [formGroup]="formLogin" (ngSubmit)="ingresar()" class="space-y-6">
                <!-- Cedula -->
                <div>
                    <label for="cedula" class="block text-sm font-semibold text-gray-700 mb-2">Cédula de
                        Identidad</label>
                    <div class="relative group">
                        <div
                            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none transition-colors group-focus-within:text-ucacue-crimson">
                            <i class="pi pi-id-card text-gray-400 group-focus-within:text-ucacue-crimson"></i>
                        </div>
                        <input type="text" id="cedula" formControlName="cedula"
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-ucacue-crimson focus:border-ucacue-crimson transition duration-200 ease-in-out text-gray-900 sm:text-sm shadow-sm hover:border-gray-400 bg-gray-50 focus:bg-white"
                            placeholder="Ingrese su número de cédula" maxlength="10" (input)="onInput($event)">
                    </div>
                    <div *ngIf="formLogin.get('cedula')?.invalid && (formLogin.get('cedula')?.touched || formLogin.get('cedula')?.dirty)"
                        class="mt-2 text-xs text-red-600 flex items-center animate-bounce-short">
                        <i class="pi pi-exclamation-circle mr-1"></i> La cédula debe contener exactamente 10 números.
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="contrasenia" class="block text-sm font-semibold text-gray-700">Contraseña</label>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="pi pi-lock text-gray-400 group-focus-within:text-ucacue-crimson"></i>
                        </div>
                        <input type="password" id="contrasenia" formControlName="contrasenia"
                            class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-ucacue-crimson focus:border-ucacue-crimson transition duration-200 ease-in-out text-gray-900 sm:text-sm shadow-sm hover:border-gray-400 bg-gray-50 focus:bg-white"
                            placeholder="••••••••">
                    </div>
                    <div class="flex justify-end mt-2">
                        <a href="#"
                            class="text-xs font-semibold text-ucacue-crimson hover:text-red-800 transition bg-transparent hover:underline">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" [disabled]="formLogin.invalid"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-sm font-bold text-white bg-ucacue-crimson hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-ucacue-crimson disabled:opacity-50 disabled:cursor-not-allowed transition-all transform hover:scale-[1.02] hover:shadow-xl relative overflow-hidden group">
                    <span class="relative z-10">INICIAR SESIÓN</span>
                    <div
                        class="absolute inset-0 h-full w-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-shimmer">
                    </div>
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-xs text-gray-400">
                    &copy; 2024 Universidad Católica de Cuenca. <br> Todos los derechos reservados.
                </p>
            </div>
        </div>
    </div>
</div>
