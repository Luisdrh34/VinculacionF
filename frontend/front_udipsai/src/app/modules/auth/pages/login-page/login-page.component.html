
<div class="min-h-screen flex items-center justify-center w-full bg-gray-100">
    <div class="bg-white shadow-md rounded-lg px-8 py-6 max-w-4xl flex">
        <div class="flex flex-col justify-center items-center w-1/2 p-4">
            <img class="mb-2" src="assets\logo_UDIPS.png" alt="Universidad Católica de Cuenca">
            <h1 class="text-xl font-bold text-center">SISTEMA WEB UDIPSAI</h1>
        </div>
        <div class="w-1/2 p-4">
            <h2 class="text-xl font-bold text-center mb-4">INICIAR SESIÓN</h2>
            <form [formGroup]="formLogin" (ngSubmit)="ingresar()">
                <div class="mb-4">
                    <label for="cedula" class="block text-sm font-medium text-gray-700 mb-2">Cédula</label>
                    <input type="text" id="cedula" formControlName="cedula"
                        class="shadow-sm rounded-md w-full px-3 py-2 border border-gray-300 focus:outline-none focus:ring-gray-500 focus:border-gray-500"
                        placeholder="Ingrese una cédula" required maxlength="10" (input)="onInput($event)">
                    <div *ngIf="formLogin.get('cedula')?.invalid && formLogin.get('cedula')?.touched"
                        class="text-red-600 text-sm">
                        La cédula debe contener exactamente 10 números.
                    </div>
                </div>
                <div class="mb-4">
                    <label for="contrasenia" class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                    <input type="password" id="contrasenia" formControlName="contrasenia"
                        class="shadow-sm rounded-md w-full px-3 py-2 border border-gray-300 focus:outline-none focus:ring-gray-500 focus:border-gray-500"
                        placeholder="Ingrese su contraseña" required>
                </div>
<button type="submit"
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
        [ngClass]="{'bg-gray-400 cursor-not-allowed': formLogin.get('cedula')?.value.length != 10 || formLogin.get('contrasenia')?.value.length <= 0 , 'bg-red-600 hover:bg-red-700': formLogin.get('cedula')?.value.length == 10&& formLogin.get('contrasenia')?.value.length > 0}"
        [disabled]="formLogin.get('cedula')?.value.length != 10">
    Iniciar Sesión
</button>


            </form>
            <div class="flex justify-center mt-4">
                <a href="#" class="text-sm text-gray-500 hover:text-gray-700">Olvide mi contraseña</a>
            </div>
        </div>
    </div>
</div>
