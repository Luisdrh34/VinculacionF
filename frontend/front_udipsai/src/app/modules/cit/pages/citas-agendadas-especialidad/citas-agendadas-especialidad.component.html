<div class="container">
  <h1 class="title">Ver Citas Agendadas</h1>
  <p class="subtitle">Aquí puede ver todas las citas agendadas.</p>

  <!-- Campo de búsqueda -->
  <div class="search-bar">
    <i class="pi pi-search"></i>
    <span class="p-input-icon-left">
      <input
        type="text"
        pInputText
        [(ngModel)]="filtroCitas"
        placeholder="Número Ficha"
        (input)="loadCitas()"
      />
    </span>
  </div>

  <div class="card">
    <p-table
      [value]="citas"
      [paginator]="true"
      responsiveLayout="scroll"
      [rows]="rows"
      [totalRecords]="totalRecords"
      [lazy]="true"
      (onLazyLoad)="loadCitasLazy($event)"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Paciente</th>
          <th>Fecha de Cita</th>
          <th>Hora de Cita</th>
          <th>Motivo</th>
          <th>Estado</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-cita>
        <tr>
          <td>{{ cita.idCita }}</td>
          <td>{{ cita.fichaPaciente }}</td>
          <td>{{ cita.fecha }}</td>
          <td>{{ cita.horaInicio }}</td>
          <td>{{ cita.area.nombre }}</td>
          <td>{{ cita.estado }}</td>

        </tr>
      </ng-template>
    </p-table>
    <div class="flex justify-center items-center mb-4">
      <!-- Dropdown para seleccionar el número de filas por página -->
      <p class="text-sm text-gray-600">Filas por página:</p>
      <p-dropdown
        [options]="rowsOptions"
        [(ngModel)]="rows"
        (onChange)="onRowsChange($event)"
        placeholder="Filas por página"
        class="rows-dropdown"
      ></p-dropdown>

      <!-- Mostrar el total de registros -->
      <div class="text-center">
        <p class="text-sm text-gray-600">
          Total de registros: {{ totalRecords }}
        </p>
      </div>
    </div>
  </div>
</div>
