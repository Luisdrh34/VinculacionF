<header
  class="bg-white shadow-sm w-full h-20 flex items-center justify-between px-6 z-50 fixed top-0 left-0 border-b border-gray-100 font-sans">
  <!-- Logo section -->
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md">
      UD
    </div>
    <div class="flex flex-col">
      <span class="text-xl font-bold text-gray-800 tracking-tight leading-none">UDIPSAI</span>
      <span class="text-xs text-gray-500 font-medium tracking-wider">SISTEMA INTEGRAL</span>
    </div>
  </div>

  <!-- Centered Navigation -->
  <nav class="hidden md:flex items-center gap-2 h-full">
    <!-- Inicio -->
    <a routerLink="/principal/home" routerLinkActive="bg-red-50 text-red-600"
      class="flex items-center gap-2 px-4 py-2 rounded-full text-gray-600 hover:bg-gray-50 hover:text-red-600 font-medium transition-all duration-200">
      <i class="pi pi-home"></i>
      <span>Inicio</span>
    </a>

    <!-- Gestión de Citas Dropdown -->
    <div class="relative group h-full flex items-center">
      <button
        class="flex items-center gap-2 px-4 py-2 rounded-full text-gray-600 hover:bg-gray-50 hover:text-red-600 font-medium transition-all duration-200">
        <i class="pi pi-calendar"></i>
        <span>Gestión de Citas</span>
        <i class="pi pi-chevron-down text-xs transition-transform duration-200 group-hover:rotate-180"></i>
      </button>

      <!-- Dropdown Menu -->
      <div
        class="absolute top-[80%] left-1/2 -translate-x-1/2 w-64 bg-white rounded-xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top z-50 p-2">

        <!-- Agendamiento -->
        <a *akoShowForRoles="['ADMIN', 'COORDINADOR', 'SECRETARIA']" routerLink="/principal/cit/agendamiento-citas"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          <i class="pi pi-plus-circle text-red-500"></i>
          <span>Agendamiento Citas</span>
        </a>

        <a *akoShowForRoles="['PROFESIONAL']" routerLink="/principal/cit/citas-agendadas-usuario"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          <i class="pi pi-list text-red-500"></i>
          <span>Mis Citas Agendadas</span>
        </a>

        <a *akoShowForRoles="['PASANTE']" routerLink="/principal/cit/citas-agendadas-especialidad"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          <i class="pi pi-list text-red-500"></i>
          <span>Citas por Especialidad</span>
        </a>

        <a *akoShowForRoles="['ADMIN', 'COORDINADOR', 'SECRETARIA']" routerLink="/principal/cit/citas-agendadas"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          <i class="pi pi-calendar-times text-red-500"></i>
          <span>Todas las Citas</span>
        </a>
      </div>
    </div>

    <!-- Usuarios Dropdown -->
    <div class="relative group h-full flex items-center">
      <button
        class="flex items-center gap-2 px-4 py-2 rounded-full text-gray-600 hover:bg-gray-50 hover:text-red-600 font-medium transition-all duration-200">
        <i class="pi pi-users"></i>
        <span>Usuarios</span>
        <i class="pi pi-chevron-down text-xs transition-transform duration-200 group-hover:rotate-180"></i>
      </button>

      <!-- Dropdown Menu -->
      <div
        class="absolute top-[80%] left-1/2 -translate-x-1/2 w-64 bg-white rounded-xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top z-50 p-2">

        <div class="px-4 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Gestión</div>

        <a *akoShowForRoles="['ADMIN', 'COORDINADOR', 'SECRETARIA']" routerLink="/principal/usu/gestion-profesionales"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          <i class="pi pi-user-plus text-blue-500"></i>
          <span>Profesionales</span>
        </a>

        <a *akoShowForRoles="['ADMIN', 'COORDINADOR', 'SECRETARIA', 'PROFESIONAL']"
          routerLink="/principal/usu/gestion-pasantes"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          <i class="pi pi-user text-green-500"></i>
          <span>Pasantes</span>
        </a>

        <a *akoShowForRoles="['ADMIN', 'COORDINADOR', 'SECRETARIA']" routerLink="/principal/usu/gestion-cordinadores"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          <i class="pi pi-id-card text-purple-500"></i>
          <span>Coordinadores</span>
        </a>

        <a *akoShowForRoles="['ADMIN', 'COORDINADOR', 'SECRETARIA']" routerLink="/principal/usu/gestion-secretarias"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          <i class="pi pi-briefcase text-orange-500"></i>
          <span>Secretarias</span>
        </a>
      </div>
    </div>

    <!-- Reportes Dropdown -->
    <div class="relative group h-full flex items-center" *akoShowForRoles="['ADMIN', 'COORDINADOR', 'SECRETARIA']">
      <button
        class="flex items-center gap-2 px-4 py-2 rounded-full text-gray-600 hover:bg-gray-50 hover:text-red-600 font-medium transition-all duration-200">
        <i class="pi pi-file-pdf"></i>
        <span>Reportes</span>
        <i class="pi pi-chevron-down text-xs transition-transform duration-200 group-hover:rotate-180"></i>
      </button>

      <!-- Dropdown Menu -->
      <div
        class="absolute top-[80%] left-1/2 -translate-x-1/2 w-64 bg-white rounded-xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top z-50 p-2">

        <div class="px-4 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider">Citas</div>

        <a routerLink="/principal/reportes/citas"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-red-50 hover:text-red-700 transition-colors">
          <i class="pi pi-file text-blue-500"></i>
          <span>Generar Reporte</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Profile & Logout -->
  <div class="flex items-center gap-4">
    <div class="relative group">
      <button class="flex items-center gap-3 hover:bg-gray-50 px-3 py-2 rounded-xl transition-colors">
        <div class="flex flex-col items-end hidden sm:flex">
          <span class="text-sm font-bold text-gray-700">Mi Cuenta</span>
          <span class="text-xs text-gray-500">Perfil</span>
        </div>
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-red-500 to-red-600 p-0.5 shadow-md">
          <div class="w-full h-full bg-white rounded-full flex items-center justify-center">
            <i class="pi pi-user text-red-600"></i>
          </div>
        </div>
      </button>

      <!-- User Dropdown -->
      <div
        class="absolute top-[110%] right-0 w-48 bg-white rounded-xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top-right z-50 p-2">
        <a routerLink="/principal/usu/profile"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
          <i class="pi pi-user-edit"></i>
          <span>Ver Perfil</span>
        </a>
        <div class="h-px bg-gray-100 my-1"></div>
        <button (click)="logout()"
          class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-red-600 hover:bg-red-50 transition-colors font-medium">
          <i class="pi pi-sign-out"></i>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </div>
  </div>
</header>
<div class="h-20"></div> <!-- Spacer for fixed header -->
